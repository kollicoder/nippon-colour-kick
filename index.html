<script>
"use strict";
/* ============================ CONFIG ============================ */
const CLUBS=[ // approximate kit colours (no logos)
 {n:"East Bengal FC",ab:"EBFC",a:"#e30613",b:"#ffd400"},{n:"Mumbai City FC",ab:"MCFC",a:"#4fa3e0",b:"#0b1f4b"},
 {n:"NorthEast United FC",ab:"NEUFC",a:"#222222",b:"#e2001a"},{n:"Chennaiyin FC",ab:"CFC",a:"#1d4fa3",b:"#f5c400"},
 {n:"FC Goa",ab:"FCG",a:"#f47a20",b:"#1a237e"},{n:"Kerala Blasters FC",ab:"KBFC",a:"#ffd200",b:"#0047ab"},
 {n:"Sporting Club Delhi",ab:"SCD",a:"#0a2a66",b:"#e4002b"},{n:"Odisha FC",ab:"OFC",a:"#6a1b9a",b:"#f2a900"},
 {n:"Churchill Brothers FC",ab:"CBFC",a:"#c8102e",b:"#ffffff"},{n:"Inter Kashi",ab:"IK",a:"#003f87",b:"#ff7f00"},
 {n:"Punjab FC",ab:"PFC",a:"#d71920",b:"#f4c300"}];
CLUBS.forEach(c=>c.slug=c.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""));
const ROUNDS=10;                       // alternates striker / keeper -> 5 each
const SEASON="2026-27";
const LS_KEY="blobby_colourkick_v1";
/* Target zones (3 x 2 grid, index = row*3+col; row 0 = top). Harder = more points but needs more power:
 * a top-corner shot below MIN_Q power hits the bar/post and misses. */
const ZONE_PTS=[200,120,200,100,60,100];
const MIN_Q   =[.50,.35,.50,.20,.15,.20];
const ZONE_NAME=["Top-left","Top-mid","Top-right","Low-left","Low-mid","Low-right"];
const COLOUR_BONUS_MAX=200;            // end-of-game bonus = painted% x 200
const METER_MAX=1500;                  // club avg score that fills a stadium section 100%
const SHRINK_K=3;                      // club average is shrunk toward the global avg with K phantom players
const DEMO=/[?&]demo=1/.test(location.search);
const $=id=>document.getElementById(id);

/* ======================= BACKEND HOOK (pluggable) =======================
 * Scores live in localStorage on this device until API_BASE is set (e.g. a Cloudflare Worker + KV/D1 on qred.live):
 *   POST {API_BASE}/score        body = entry (see buildEntry)      -> {ok,rank}
 *   GET  {API_BASE}/leaderboard  -> {players:[{name,club,score,ts}], clubs:[{club,players,avg,adj}]}
 * Both calls fall back to local data if API_BASE is empty or the request fails.
 *
 * ANTI-CHEAT NOTE (client code can always be tampered with, so the SERVER must be the judge):
 *  1. Ask the server for a session {seed, token} (POST /session) instead of using the client-made seed. All keeper
 *     and shooter decisions here come from a seeded PRNG (mulberry32), drawn in a fixed order.
 *  2. The entry carries `log` = every round's inputs (zone, power q, tap zone, tap time). validateEntry() below is the
 *     hook: the server replays the log with the same seed and recomputes score/goals/saves/painted; reject any mismatch,
 *     impossible inputs (q outside 0..1, dt < 120ms human limit), >1 submission per token, or > N plays/hour per IP/device.
 *  3. Only one score per player per club counts on weekly boards (best score), so spamming plays can't inflate a club.
 */
const API_BASE="";
const GAME_VERSION=1;
function validateEntry(entry){ /* SERVER-SIDE STUB: replay entry.log with entry.seed, compare totals, return true/false */ return true; }
async function submitScore(entry){
  if(!DEMO){const l=loadLocal(true);l.push(entry);saveLocal(l)}
  if(API_BASE){try{await fetch(API_BASE+"/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)})}catch(e){console.warn("submitScore fallback",e)}}
}
async function fetchLeaderboard(){
  if(API_BASE){try{const r=await fetch(API_BASE+"/leaderboard");if(r.ok)return await r.json()}catch(e){console.warn("fetchLeaderboard fallback",e)}}
  return computeBoards(loadLocal());
}
function loadLocal(rawOnly){let a=[];try{a=JSON.parse(localStorage.getItem(LS_KEY))||[]}catch(e){}return(DEMO&&!rawOnly)?a.concat(demoEntries()):a}
function saveLocal(a){try{localStorage.setItem(LS_KEY,JSON.stringify(a.slice(-500)))}catch(e){}}

/* ======================= BOARDS (pure functions) ======================= */
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
const normName=n=>String(n).trim().toLowerCase();
function computeBoards(all){
  const ws=weekStart(Date.now()),season=all.filter(e=>!e.season||e.season===SEASON);
  // PLAYER board (weekly): each player's best score this week
  const best={};season.filter(e=>e.ts>=ws).forEach(e=>{const k=normName(e.name)+"|"+e.club;if(!best[k]||e.score>best[k].score)best[k]=e});
  const players=Object.values(best).sort((a,b)=>b.score-a.score);
  // CLUB board (season): AVERAGE of each player's best score -> a big fanbase can't win just by having more people.
  // Shrinkage toward the global average stops a club with 1 lucky player topping the table.
  const per={};season.forEach(e=>{const m=per[e.club]=per[e.club]||{},k=normName(e.name);if(!m[k]||e.score>m[k])m[k]=e.score});
  let tS=0,tN=0;const clubs=CLUBS.map(c=>{const v=Object.values(per[c.n]||{}),n=v.length,s=v.reduce((a,b)=>a+b,0);tS+=s;tN+=n;return{club:c.n,players:n,sum:s,avg:n?s/n:0}});
  const gAvg=tN?tS/tN:0;clubs.forEach(c=>c.adj=c.players?(c.sum+SHRINK_K*gAvg)/(c.players+SHRINK_K):0);
  clubs.sort((a,b)=>b.adj-a.adj||b.players-a.players);
  return{players,clubs};
}
function demoEntries(){ // sample data for ?demo=1 ONLY (never stored). Big fanbases have MORE players but LOWER averages on purpose.
  const R=mulberry32(77),names=["Aarav","Meera","Kabir","Diya","Rohan","Isha","Vihaan","Anika","Arjun","Sana","Dev","Tara","Neil","Riya","Kian","Zoya"],now=Date.now(),out=[];
  const spec={"East Bengal FC":[30,520],"Mumbai City FC":[18,610],"NorthEast United FC":[7,780],"Chennaiyin FC":[12,700],"FC Goa":[22,560],"Kerala Blasters FC":[38,490],"Sporting Club Delhi":[5,640],"Odisha FC":[9,720],"Churchill Brothers FC":[4,590],"Inter Kashi":[6,680],"Punjab FC":[14,630]};
  for(const c in spec){const[n,avg]=spec[c];for(let i=0;i<n;i++)out.push({name:names[i%16]+(i>=16?i:"")+"·"+CLUBS.find(x=>x.n===c).ab,club:c,score:Math.max(120,Math.round(avg+(R()-.5)*420)),ts:now-Math.floor(R()*5*864e5),season:SEASON,demo:1})}
  return out;
}

/* ============================ UTIL ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){h=h.replace("#","");return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function lum(h){const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255}
function mix(h,k,t){const[r,g,b]=hex2rgb(h),[r2,g2,b2]=hex2rgb(k);return`rgb(${Math.round(r+(r2-r)*t)},${Math.round(g+(g2-g)*t)},${Math.round(b+(b2-b)*t)})`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ============================ SOUND ============================ */
let AC=null,muted=false;
function beep(f=440,d=.12,type="square",v=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={kick:()=>beep(120,.15,"triangle",.2),splash:()=>{beep(180,.18,"sawtooth",.1);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*80))},
 save:()=>[440,660].forEach((f,i)=>setTimeout(()=>beep(f,.15,"sawtooth"),i*80)),miss:()=>[300,200].forEach((f,i)=>setTimeout(()=>beep(f,.2,"sawtooth"),i*120))};
$("mute").onclick=e=>{muted=!muted;e.target.textContent=muted?"🔇":"🔊"};

/* ============================ BLOBBY ============================ */
/* Blobby in a club jersey. up: arms raised 0..1, brush: holds a paint brush, face: "happy"|"sad"|"" */
function drawBlob(c,x,y,s,col,rot,face,up=0,brush=false){c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);
 c.fillStyle=col.a;c.strokeStyle="#0003";c.lineWidth=2;c.beginPath();c.moveTo(0,-30);c.bezierCurveTo(26,-30,34,-6,30,14);c.bezierCurveTo(28,30,12,32,0,30);c.bezierCurveTo(-12,32,-28,30,-30,14);c.bezierCurveTo(-34,-6,-26,-30,0,-30);c.fill();c.stroke();
 c.fillStyle=col.b;c.fillRect(-30,8,60,6);
 c.fillStyle=col.a;c.beginPath();const ay=-up*30;c.ellipse(-36+up*4,ay,8,6,-.6,0,7);c.ellipse(36-up*4,ay,8,6,.6,0,7);c.fill();c.stroke();
 if(brush){c.strokeStyle="#8d6e63";c.lineWidth=4;c.lineCap="round";c.beginPath();c.moveTo(36,ay);c.lineTo(46,ay-22);c.stroke();c.fillStyle=col.b===col.a?"#fff":col.b;c.beginPath();c.ellipse(48,ay-27,6,9,.4,0,7);c.fill();c.strokeStyle="#0004";c.lineWidth=1.5;c.stroke()}
 c.fillStyle="#fff";c.beginPath();c.ellipse(-9,-10,6,7,0,0,7);c.ellipse(9,-10,6,7,0,0,7);c.fill();
 c.fillStyle="#111";c.beginPath();c.arc(-8,-8,3,0,7);c.arc(10,-8,3,0,7);c.fill();
 c.strokeStyle="#111";c.lineWidth=2.5;c.lineCap="round";c.beginPath();if(face==="sad")c.arc(0,8,6,3.6,5.8);else if(face==="happy"){c.arc(0,-1,9,.2,2.9)}else c.arc(0,0,7,.3,2.8);c.stroke();
 if(face==="happy"){c.fillStyle="#fff";c.beginPath();c.arc(0,-1,9,.2,2.9);c.closePath();c.fill();c.stroke()}
 c.fillStyle="rgba(255,255,255,.25)";c.beginPath();c.ellipse(-12,-18,8,5,-.5,0,7);c.fill();c.restore()}
function blobSVG(c){return`<path d="M65 12c22 0 44 14 46 42 2 22-6 30-4 44 1 10-10 20-20 16-8-3-10 4-22 4s-14-7-22-4c-10 4-21-6-20-16 2-14-6-22-4-44C21 26 43 12 65 12z" fill="${c.a}" stroke="#0003" stroke-width="2"/><path d="M22 78h86v8H22z" fill="${c.b}"/><ellipse cx="50" cy="50" rx="11" ry="13" fill="#fff"/><ellipse cx="80" cy="50" rx="11" ry="13" fill="#fff"/><circle cx="53" cy="53" r="5" fill="#111"/><circle cx="83" cy="53" r="5" fill="#111"/><path d="M48 70q17 14 34 0" fill="#fff" stroke="#111" stroke-width="3"/>`}

/* ============================ PAINT SPLATS ============================ */
/* A splat is deterministic from its seed so the scorecard and the live game show the same shape. */
function drawSplat(c,s,k){const R=mulberry32(s.seed),r=s.r;c.save();c.translate(s.x,s.y);c.scale(k,k);
 const n=14,pts=[];for(let i=0;i<n;i++){const a=i/n*6.283,rad=r*(.72+R()*.42);pts.push([Math.cos(a)*rad,Math.sin(a)*rad])}
 const path=(P,sc)=>{c.beginPath();for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n],mx=(p[0]+q[0])/2*sc,my=(p[1]+q[1])/2*sc;if(i===0){const l=P[n-1];c.moveTo((l[0]+p[0])/2*sc,(l[1]+p[1])/2*sc)}c.quadraticCurveTo(p[0]*sc,p[1]*sc,mx,my)}c.closePath()};
 c.fillStyle=s.cols[0];path(pts,1);c.fill();
 c.fillStyle=s.cols[1];path(pts,.62);c.fill();
 c.fillStyle=s.cols[2%s.cols.length];c.beginPath();c.arc(-r*.12,-r*.1,r*.2,0,7);c.fill();
 const nd=12+Math.floor(R()*6);for(let i=0;i<nd;i++){const a=R()*6.283,d=r*(1.05+R()*.85),sz=r*(.04+R()*.1);c.fillStyle=s.cols[Math.floor(R()*s.cols.length)];c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,sz,0,7);c.fill()}
 const dr=2+Math.floor(R()*2);c.lineCap="round";for(let i=0;i<dr;i++){const x=(R()-.5)*r*1.1,len=r*(.5+R()*.9);c.strokeStyle=s.cols[i%2];c.lineWidth=r*(.09+R()*.05);c.beginPath();c.moveTo(x,r*.3);c.lineTo(x,r*.3+len);c.stroke();c.fillStyle=s.cols[i%2];c.beginPath();c.arc(x,r*.3+len,r*.075,0,7);c.fill()}
 c.fillStyle="rgba(255,255,255,.28)";c.beginPath();c.ellipse(-r*.3,-r*.35,r*.22,r*.12,-.6,0,7);c.fill();c.restore()}

/* ============================ GAME STATE ============================ */

const cOf=n=>CLUBS.find(c=>c.n===n)||CLUBS[0];
async function renderBoard(){const d=await fetchLeaderboard(),el=$("boardBody"),me=lastEntry,mine=club&&club.n;
 if(tab==="p"){const L=d.players.slice(0,10);
  el.innerHTML=`<div class="note">Best score per player this week (Mon–Sun)</div><table>`+(L.length?L.map((e,i)=>`<tr class="${me&&e.ts===me.ts?"me":""}"><td>${i+1}</td><td><span class="chip" style="background:${cOf(e.club).a}"></span>${esc(e.name)}<br><small style="opacity:.6">${esc(e.club)}</small></td><td>${e.score}</td></tr>`).join(""):"<tr><td>No scores this week yet — be the first!</td></tr>")+"</table>"}
 else if(tab==="c"){el.innerHTML=`<div class="note">Season ${SEASON} · <b>average of each player's best score</b>, so bigger fanbases don't win just by numbers</div><table>`+d.clubs.map((c,i)=>`<tr class="${c.club===mine?"me":""}"><td>${i+1}</td><td><span class="chip" style="background:${cOf(c.club).a}"></span>${esc(c.club)}<br><small style="opacity:.6">${c.players} player${c.players===1?"":"s"} · avg ${Math.round(c.avg)}</small></td><td>${Math.round(c.adj)}</td></tr>`).join("")+"</table>"}
 else{el.innerHTML=`<div class="note">Each stand fills with <b>average points per player</b> (1500 = full). Fair for every fanbase.</div><div id="stadWrap"><canvas id="stad"></canvas></div><div id="stadList"></div>`;drawStadium(d.clubs,mine);
  $("stadList").innerHTML=d.clubs.map(c=>{const cl=cOf(c.club),f=Math.min(1,c.adj/METER_MAX);return`<div style="margin:7px 0;font-size:12px"><div style="display:flex;justify-content:space-between"><span><span class="chip" style="background:${cl.a}"></span><b>${cl.ab}</b> · ${c.players} players</span><span>avg ${Math.round(c.avg)}</span></div><div class="bar"><i style="width:${Math.round(f*100)}%;background:linear-gradient(90deg,${cl.a},${cl.b})"></i></div></div>`}).join("")}}
function drawStadium(clubs,mine){const cvs=$("stad"),w=cvs.clientWidth||340,h=Math.round(w*.74),dpr=Math.min(window.devicePixelRatio||1,2);cvs.width=w*dpr;cvs.height=h*dpr;cvs.style.height=h+"px";const c=cvs.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
